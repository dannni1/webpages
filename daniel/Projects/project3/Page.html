<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page3</title>
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Satisfy'>
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Varela Round'>
    <link rel='stylesheet' href="style/Style_page3.css">
</head>

<body>
    <section class="page">
        <h1>Here & Now</h1>
        <p class="p_1">רצינו להזמין אתכם להנות משלל מתנות</p>
        <p class="p_2">לורם איפסום דולור סיט אמט, קונסקטורר אדיפיסינג אלית לפרומי בלוף קינץ תתיח לרעח. לת צשחמי צש בליא, מנסוטו צמלח לביקו
        ננבי, צמוקו בלוקריה.</p>

        <div class="wrap">
            <form class="form">
                <div class="group">
                    <label for="name">שם מלא</label>
                    <input type="text" id="name" minlength="1" maxlength="15" required>
                </div>
            
                <div class="group">
                    <label for="email">דוא״ל</label>
                    <input type="text" id="email" minlength="5" maxlength="20" required>
                </div>
            
                <div class="group">
                    <button type="submit">עדכנו אותי</button>
                </div>
            </form>
        </div>
    </section>

<script src=""></script>
</body>
</html>
