<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page2</title>
    <link rel="stylesheet" href="style/Style_page2.css">
</head>

<body>
    <section class="upper-part">
        <h1>תן לנו להוביל אותך קדימה</h1>
        <p>לורם איפסום או בקיצור ליפסום, הוא מלל מקובל וחסר משמעות המשמש “ממלא מקום” בעת עריכ.</p>
    </section>

    <section class="bottom-part">
        <form>
            <div class="bottom-part-group">
                <label for="name">שם מלא</label>
                <input type="text" id="name" minlength="1" maxlength="15" required>
            </div>

            <div class="bottom-part-group">
                <label for="email">דוא״ל</label>
                <input type="text" id="email" minlength="5" maxlength="20" required>
            </div>

            <div class="bottom-part-group">
                <button type="submit">שליחה</button>
            </div>
        </form>
    </section>

<script src=""></script>
</body>
</html>
