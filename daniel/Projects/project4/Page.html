<body>
<div class="container">
    <section class="left"></section>
    <section class="right">
        <h1>קפה טוב לבוקר טוב</h1>
        <p>לקבלת קופון לקפה חינם ומפנק שיפתח לכם את היום בחיוך, יש למלא את הפרטים:</p>
                <div class="wrap">
                    <form class="form">
                        <div class="group">
                            <label for="name">שם מלא</label>
                            <input type="text" id="name" minlength="1" maxlength="15" required>
                        </div>
                
                        <div class="group">
                            <label for="email">דוא״ל</label>
                            <input type="text" id="email" minlength="5" maxlength="20" required>
                        </div>
                
                        <div class="group">
                            <button type="submit">שליחה</button>
                        </div>
                    </form>
                </div>
    </section>
</div>
