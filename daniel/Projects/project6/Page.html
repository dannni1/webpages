<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page4</title>
    <link href='https://fonts.googleapis.com/css?family=Heebo' rel='stylesheet'>
    <link rel='stylesheet' href="style/Style_page6.css">
</head>

<body>
    <div class="container">
        <section class="right"><div class="right-background"></div></section>

        <section class="left">
            <div class="icon-circle-top"><img src="images/icon_whatsapp.png"></div>
            <h1>ייעוץ חינם</h1>
            <p>לקבלת קופון לקפה חינם ומפנק שיפתח לכם את היום בחיוך, יש למלא את הפרטים:</p>
            <div class="wrap">
                <form class="form">
                    <div class="row-group">
                        <div class="group">
                            <label for="name">שם מלא</label>
                            <input type="text" id="name" minlength="1" maxlength="15" required>
                        </div>
            
                        <div class="group">
                            <label for="email">דוא״ל</label>
                            <input type="text" id="email" minlength="5" maxlength="20" required>
                        </div>
                    </div>

                    <div class="group">
                        <label for="message">שם מלא</label>
                        <textarea id="message"></textarea>
                    </div>

                    <div class="group">
                        <button type="submit">שליחה</button>
                    </div>
                </form>
            </div>

            <div class="container-icon">
                <div class="icon-circle"><i></i></div>
                <div class="icon-circle"><i></i></div>
                <div class="icon-circle"><i></i></div>
                <div class="icon-circle"><i></i></div>
            </div>
        </section>
    </div >
<script src=".js"></script>
</body>

</html>
