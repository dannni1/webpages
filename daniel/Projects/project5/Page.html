<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>page5</title>
    <link rel="stylesheet" href="style/Style_page5.css" />
</head>

<body>
    <section class="grid-parent">
        <div class="grid-child">
            <img src="images/img_1.png">
            <img src="images/img_2.png">
            <img src="images/img_3.png">
            <img src="images/img_4.png">
            <img src="images/img_5.png">
            <img src="images/img_6.png">
        </div>

        <div class="grid-child">
            <div class="grid-2x2">
                <h1>לגלות את העולם</h1>
                <p>לורם איפסום או בקיצור ליפסום, הוא מלל מקובל וחסר משמעות המשמש “ממלא מקום” בעת עריכ.</p>
            </div>
            <img src="images/img_7.png">
            <img src="images/img_8.png">
        </div>

        <div class="grid-child" id="form_box">
            <h1>ספרו לנו על החוויה שלכם</h1>
            <p>לורם איפסום או בקיצור ליפסום, הוא מלל מקובל וחסר משמעות המשמש “ממלא מקום” בעת עריכ.</p>
            <div class="wrap">
                <form class="form">
                    <div class="group">
                        <label for="name">שם מלא</label>
                        <input type="text" id="name" minlength="1" maxlength="15" required>
                    </div>
            
                    <div class="group">
                        <label for="email">דוא״ל</label>
                        <input type="text" id="email" minlength="5" maxlength="20" required>
                    </div>

                    <div class="group">
                        <label for="message">דוא״ל</label>
                        <textarea id="message"></textarea>
                    </div>
            
                    <div class="group">
                        <button type="submit">שליחה</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="grid-child">
            <img src="images/img_9.png">
            <img src="images/img_10.png">
            <img src="images/img_11.png">
            <img src="images/img_12.png">
            <img src="images/img_13.png">
            <img src="images/img_14.png">
        </div>
    </section>

<script src=""></script>
</body>

</html>
